{% extends "base.html" %}

{% block title %}Login - CoI{% endblock %}

{% block content %}
<div class="flex justify-center items-center min-h-screen">
    <div class="max-w-md w-full bg-white dark:bg-gray-800 p-8 rounded-lg shadow">
        <div class="text-center mb-8">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" class="mx-auto h-16 w-auto">
            <h2 class="mt-4 text-2xl font-bold text-gray-900 dark:text-white">Sign in to your account</h2>
        </div>
        
        <form method="POST" action="{{ url_for('auth.login') }}" class="space-y-6">
            <div>
                <label for="username" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Username</label>
                <input id="username" name="username" type="text" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:text-white">
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Password</label>
                <input id="password" name="password" type="password" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:text-white">
            </div>
            <div>
                <button type="submit" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                    Sign in
                </button>
            </div>
        </form>
        
        <div class="mt-6 text-center">
            <a href="{{ url_for('auth.oauth2_login') }}" class="text-blue-600 hover:text-blue-500">
                Sign in with OAuth2
            </a>
        </div>
        
        {% if local_registration_enabled %}
        <div class="mt-6 text-center">
            <p class="text-sm text-gray-600 dark:text-gray-400">
                Don't have an account?
                <a href="{{ url_for('auth.register') }}" class="font-medium text-blue-600 hover:text-blue-500">
                    Register
                </a>
            </p>
        </div>
        {% endif %}
    </div>
</div>
{% endblock %}
