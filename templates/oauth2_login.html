{% extends "base.html" %}

{% block title %}OAuth2 Login - CoI{% endblock %}

{% block content %}
<div class="max-w-md w-full bg-white dark:bg-gray-800 p-8 rounded-lg shadow">
    <div class="text-center mb-8">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" class="mx-auto h-16 w-auto">
        <h2 class="mt-4 text-2xl font-bold text-gray-900 dark:text-white">Sign in with OAuth2</h2>
    </div>
    
    <p class="text-center text-gray-700 mb-6">
        You can authenticate using an external OAuth2 provider.
    </p>
    
    <div class="space-y-4">
        <div class="flex justify-center">
            <a href="{{ url_for('github.login') }}" class="bg-gray-800 hover:bg-gray-700 text-white font-bold py-2 px-6 rounded-lg transition duration-300">
                Login with GitHub
            </a>
        </div>
        <div class="flex justify-center">
            <a href="{{ url_for('google.login') }}" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-6 rounded-lg transition duration-300">
                Login with Google
            </a>
        </div>
    </div>
    
    <div class="mt-6 text-center">
        <a href="{{ url_for('auth.login') }}" class="text-blue-600 hover:text-blue-500">
            Back to regular login
        </a>
    </div>
</div>
{% endblock %}
